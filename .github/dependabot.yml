# Pembaruan dependensi otomatis. Rilis baru menunggu 7 hari (cooldown) supaya versi yang tercemar
# punya waktu untuk terdeteksi sebelum masuk repositori. Pembaruan keamanan tidak ikut ditunda.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(api)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(web)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Base image di Dockerfile (tag dan digest diperbarui bersama)
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(api)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(web)"
