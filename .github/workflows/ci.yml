name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hak akses minimum: workflow ini hanya perlu membaca kode.
permissions:
  contents: read

# Push baru ke cabang yang sama membatalkan run lama yang belum selesai.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Semua action di-pin ke SHA commit (versi tertulis di komentar).
jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14" # sama dengan api/Containerfile
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Pasang dependensi
        run: python -m pip install -r requirements-dev.txt
      - name: Jalankan tes
        run: pytest

  frontend:
    name: Frontend (lint, tes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2" # jsdom 30 butuh minimal 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tes
        run: npm test
      - name: Build
        run: npm run build

  containers:
    name: Container (build dan smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image, jalankan, dan uji lewat HTTP
        run: bash scripts/smoke-containers.sh
