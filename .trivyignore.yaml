# Temuan yang diterima sementara. Setiap entri wajib punya alasan (statement) dan expired_at.
# Setelah tanggalnya lewat, entri tidak berlaku lagi dan pemindaian kembali merah, supaya diputuskan ulang.
#
# Sekarang hanya tersisa CVE-2026-78669: binary Caddy yang dipakai sekarang dibangun dari source dengan
# Go 1.26.10 (tahap caddy-src di frontend/Dockerfile), jadi CVE-2026-78667 (net/http Range, diperbaiki
# di Go 1.26.9) dan CVE-2026-97031 (ECH, diperbaiki di Go 1.26.9) sudah aman dan entrinya bisa dihapus.
# CVE-2026-78669 (golang.org/x/net http2, butuh x/net >= 0.60) belum aman di binary resmi Caddy; mitigasinya
# ada di frontend/Caddyfile (servers { protocols h1 }) dan pembenarannya diuji di scripts/smoke-containers.sh.
#
# Pembenaran diuji tiap CI di scripts/smoke-containers.sh (bagian "mitigasi CVE Caddy").
vulnerabilities:
  - id: CVE-2026-78669
    paths:
      - "usr/bin/caddy"
    statement: >-
      Banjir frame SETTINGS HTTP/2. Caddy sempat menerima HTTP/2 cleartext (h2c) di port 8080 (diuji),
      sekarang dimatikan lewat servers { protocols h1 } di frontend/Caddyfile. Diuji.
    expired_at: 2026-10-31
